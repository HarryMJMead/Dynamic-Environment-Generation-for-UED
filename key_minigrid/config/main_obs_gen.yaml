defaults:
  - common
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

# === Ratio ===
top_adv: 2
pro_train_subset_envs: 128

# === Obs Gen ===
sparse: False
mixed: False
min_capped: False
num_pro_traj: 1
num_plans: 3
reward_mix: 0.9
set_start: False
unsolvable_penalty: 10
unsolvable_approx_rollouts: 1
solvable_threshold: 0.5

# === Env ===
max_height: 13
max_width: 13
max_steps_in_episode: 250

# === PPO === 
num_updates: 30000
num_env_steps: null
num_train_envs: 256
# === Student hyperparams ===
student_num_steps: 256
student_anneal_lr: True
student_lr: 2.4e-4
student_max_grad_norm: 0.5
student_num_minibatches: 4
student_gamma: 0.995
student_epoch_ppo: 4
student_clip_eps: 0.04
student_gae_lambda: 0.95
student_entropy_coeff: 1e-3
student_critic_coeff: 0.5
student_kl_coeff: 0
# === Adversary hyperparams ===
adv_random_z_dimension: 16
adv_zero_out_random_z: False
adv_num_steps: 171
adv_anneal_lr: True
adv_lr: 2.4e-4
adv_max_grad_norm: 0.5
adv_num_minibatches: 4
adv_gamma: 0.999
adv_epoch_ppo: 4
adv_clip_eps: 0.2
adv_gae_lambda: 0.95
adv_entropy_coeff: 5e-2
adv_critic_coeff: 0.5

# === NVL hyperparams ===
nvl_gamma: 0.995
nvl_gae_lambda: 0.95

# === Random Initial Fill ===
obs_fill_prob: 0.0
wall_fill_prob: 0.3

# === Generator Hyperparams ===
goal_prob: 0.01