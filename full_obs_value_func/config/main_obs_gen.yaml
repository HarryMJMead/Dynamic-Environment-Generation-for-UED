defaults:
  - common
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog
  - _self_

# === OBS GEN ===
metric: optimal_regret
sparse: False
critic_train_optimal: True
unobserved_empty: False

# === Critic hyperparams ===
critic_gae_lambda: 0.95
critic_num_minibatches: 1
critic_epoch_ppo: 5
critic_clip_eps: 1.0
critic_lr: 1e-3
critic_max_grad_norm: 0.5

# === PPO === 
num_updates: 30000
num_env_steps: null
num_train_envs: 128
# === Student hyperparams ===
student_num_steps: 256
student_lr: 1e-4
student_max_grad_norm: 0.5
student_num_minibatches: 1
student_gamma: 0.995
student_epoch_ppo: 5
student_clip_eps: 0.2
student_gae_lambda: 0.95
student_entropy_coeff: 1e-3
student_critic_coeff: 0.5
student_kl_coeff: 0
# === Adversary hyperparams ===
adv_random_z_dimension: 16
adv_zero_out_random_z: False
adv_num_steps: 170
adv_lr: 1e-4
adv_max_grad_norm: 0.5
adv_num_minibatches: 1
adv_gamma: 0.995
adv_epoch_ppo: 5
adv_clip_eps: 0.2
adv_gae_lambda: 0.95
adv_entropy_coeff: 5e-2
adv_critic_coeff: 0.5
