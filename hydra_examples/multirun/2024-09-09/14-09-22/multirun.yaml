hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - seed=1235623451,5421344,672351
  job:
    name: maze_paired
    chdir: null
    override_dirname: seed=1235623451,5421344,672351
    id: ???
    num: ???
    config_name: main_paired
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /workspace/ued/hydra_examples
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/ued/hydra_examples/config
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
project: Dense_PAIRED
run_name: None
seed: 913472234
mode: train
checkpoint_directory: None
checkpoint_to_eval: -1
checkpoint_save_interval: -1
max_number_of_checkpoints: 60
eval_freq: 250
eval_num_attempts: 10
eval_levels:
- SixteenRooms
- SixteenRooms2
- Labyrinth
- LabyrinthFlipped
- Labyrinth2
- StandardMaze
- StandardMaze2
- StandardMaze3
agent_view_size: 5
num_updates: 30000
num_env_steps: null
num_train_envs: 32
student_num_steps: 256
student_lr: 0.0001
student_max_grad_norm: 0.5
student_num_minibatches: 1
student_gamma: 0.995
student_epoch_ppo: 5
student_clip_eps: 0.2
student_gae_lambda: 0.95
student_entropy_coeff: 0.001
student_critic_coeff: 0.5
adv_random_z_dimension: 16
adv_zero_out_random_z: false
adv_num_steps: 60
adv_lr: 0.0001
adv_max_grad_norm: 0.5
adv_num_minibatches: 1
adv_gamma: 0.995
adv_epoch_ppo: 5
adv_clip_eps: 0.2
adv_gae_lambda: 0.95
adv_entropy_coeff: 0.05
adv_critic_coeff: 0.5
